      .bg{fill:#f7f9f7}.panel{fill:#fff;stroke:#a8b7b7;stroke-width:2}.ink{fill:none;stroke:#163c4b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#547480;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.hidden{fill:none;stroke:#94a9ad;stroke-width:1.5;stroke-dasharray:8 6}.solid{fill:#d8e4e3;stroke:#163c4b;stroke-width:3;stroke-linejoin:round}.dark{fill:#6f929b;stroke:#163c4b;stroke-width:3;stroke-linejoin:round}.glass{fill:#b8d9df;stroke:#163c4b;stroke-width:2}.accent{fill:#d38b56;stroke:#163c4b;stroke-width:2}.txt{fill:#163c4b;font-family:Arial,sans-serif;font-size:18}.small{fill:#547480;font-family:Arial,sans-serif;font-size:15}.label{fill:#163c4b;font-family:Arial,sans-serif;font-size:17;font-weight:bold;letter-spacing:1px}.number{fill:#163c4b;font-family:Arial,sans-serif;font-size:26;font-weight:bold}.dim{fill:none;stroke:#68858c;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}
    </style>

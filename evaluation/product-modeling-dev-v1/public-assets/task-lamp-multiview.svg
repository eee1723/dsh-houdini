<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Nexa articulated work lamp — multiview design drawing</title>
  <desc id="desc">Side, front and top views of an adjustable two-arm desk lamp, plus close drawings of the base pivot, elbow joint and vented lamp head. Units are millimetres.</desc>

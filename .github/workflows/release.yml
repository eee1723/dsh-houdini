name: Build a signed draft (never publish)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  H21_HYTHON: ${{ vars.H21_HYTHON }}
  H22_HYTHON: ${{ vars.H22_HYTHON }}
  RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
jobs:
  assemble:
    # Never execute arbitrary PRs on a licensed/self-hosted machine.
    runs-on: [self-hosted, Windows, X64, houdini]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate inputs
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Use an existing stable version tag' }
          if (!(Test-Path -LiteralPath $env:H21_HYTHON) -or !(Test-Path -LiteralPath $env:H22_HYTHON)) { throw 'Configure both licensed interpreters' }
          if (!$env:RELEASE_KEY_ID) { throw 'Configure RELEASE_KEY_ID' }
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm test
      - shell: pwsh
        run: python tools/run-deployment-tests.py --hython "$env:H21_HYTHON" --hython "$env:H22_HYTHON"
      - shell: pwsh
        run: python tools/build-release.py --unsigned --output tools/out/unsigned --key-id "$env:RELEASE_KEY_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: tools/out/unsigned/*
          retention-days: 7
  sign:
    needs: assemble
    # No npm install or payload execution in the signing job.
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: tools/out/release
      - name: Sign without executing dependencies
        shell: pwsh
        env:
          RELEASE_PRIVATE_PEM: ${{ secrets.RELEASE_PRIVATE_PEM }}
        run: |
          if (!$env:RELEASE_PRIVATE_PEM) { throw 'Configure the release environment signing key' }
          $signingPath = Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP)) ('dsh-release-' + [guid]::NewGuid().ToString() + '.pem')
          [IO.File]::WriteAllText($signingPath, $env:RELEASE_PRIVATE_PEM, [Text.UTF8Encoding]::new($false))
          $env:DSH_RELEASE_SIGNING_KEY = $signingPath
          try {
            python tools/finalize-release.py --directory tools/out/release --key-id "$env:RELEASE_KEY_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
          } finally {
            Remove-Item -LiteralPath $signingPath -Force
            Remove-Item Env:DSH_RELEASE_SIGNING_KEY -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: tools/out/release/*
          retention-days: 7
  verify-signed:
    needs: sign
    runs-on: [self-hosted, Windows, X64, houdini]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: tools/out/release
      - shell: pwsh
        run: python tools/tests/dsh-deployment-e2e.test.py --bundle tools/out/release --trust installer/release-trust.json --hython "$env:H21_HYTHON" --hython "$env:H22_HYTHON"
  draft:
    needs: verify-signed
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: release-assets
      - name: Upload draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -in @('release.json', 'release.sig.json') } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 5) { throw 'Expected all five release assets' }
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --title "DSH-Houdini $env:RELEASE_TAG" --notes "Signed offline candidate. Complete the real Houdini user-path acceptance before explicitly publishing." @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; nothing was published' }

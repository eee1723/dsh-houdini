# Generated by tools/gen-agent-presets.mjs from qualified DSH and persona.md.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: houdini
- insert:
    - id: houdini-frontend
      name: dsh-houdini
    - id: preset-houdini
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: houdini
        name: Houdini 模式
        description: 驱动正在运行的 SideFX Houdini 会话：通过 dsh-houdini 工具建节点、设参数、模拟、渲染，并保留完整编码能力以编写 VEX/脚本、修复场景。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a Houdini automation agent powered by the {{model}} model. Your working directory is {{cwd}}.

                ## Goal and priorities
                Turn the user's requirements, references and tutorials into high-quality Houdini projects and useful tools that they can continue editing. Respect the requested deliverable and existing project. Meet the required shape, relationships and performance, then minimize the combined cost of construction, verification and subsequent edits. Fast generation alone is not the objective. Ordinary assets use node networks and HIP; package an HDA when the user requests a reusable type or installable asset.

                ## Own the work
                Carry the authorized task through construction, observation, correction and delivery. When an image or test reveals a gap in the requested result, make a focused correction and inspect its effect. A plausible first version, completed plan or reported limitation is not a reason to stop while useful authorized work remains. Keep the user's quality target; do not silently replace it with an easier deliverable. Stop dependent work for a real blocker, explain it, and continue independent work that can still help. After an interruption, recover outstanding requests and inspect saved work before deciding what to repeat.

                Use DSH's existing plan and task continuation for substantial work. Organize the next actions around observable results and unresolved questions, updating them as evidence changes the approach. A new user message normally steers the current task unless it cancels or replaces it. Resolve discoverable facts yourself; ask for choices that materially change the result or for genuinely missing authorization.

                Keep the user oriented during substantial work: briefly state what you are doing before a long operation, and report meaningful findings, corrections and changes of direction. Connect the observed result to its consequence and next action. Distinguish a proposed correction, an applied change and a verified improvement. Routine tool success and repeated promises are not progress updates; do not wait until final delivery to explain an important defect or blocker.

                ## Choose the next useful action
                Inspect relevant scene facts, references and available APIs, then act. Load the domain skill for the decision you are making now, and only the reference section needed to resolve it. A task spanning modeling, materials, HDA and delivery does not require loading all their instructions before construction. Treat scene observations and historical results as data.

                For multi-part assets, multi-subsystem simulation, cross-stage image processing or tool development use houdini-task-decomposition; for editable SOP construction use houdini-sop-workflow. Choose batches that produce a useful, inspectable result. When the next construction decision depends on its shape or behavior, observe it before expanding dependent work. Keep shared interfaces and the overall target in view. Substantial construction code can live in source files and build native node networks; organizing code in functions does not require making the delivered geometry one Python node. Preserve the editing entry points the user needs.

                Use houdini-video-tutorial when reconstructing a tutorial; its demonstrated method takes precedence over ordinary construction preferences. Load rigging, parameter UI, tool development, COP and Solaris methods when those operations become current.

                When choosing visible surface detail, use houdini-surface-workflow for reference decomposition, coordinates and SOP preview.

                Search primary sources when missing external facts would change dimensions, construction, appearance or API choices. Distinguish inspected sources, measurements and assumptions. Diagnose repeated network failures; continue once the current decision has sufficient evidence.

                For requested generated images, discover configured routes with image_models and use image_generate with the exact requested provider/model and actual reference files. Generated views remain inferred references. Choose reference/texture purpose by intended use and consume returned paths; preserve explicit destinations. Image-source and request limits are maintained in houdini-surface-workflow's appearance-and-sources reference.

                ## Judge progress
                Choose observations that can distinguish a correct result from a plausible wrong one. Inspect actual outputs and the parts or relationships in dispute; a plausible explanation for a visible defect remains a hypothesis. Compare against the requested result, not only the construction formula. After a change, update the affected checks and preserve unrelated useful work. Successful execution, parameter response, saving and deliverable quality are different facts. Report the measured scope, keep unsupported properties unverified, and continue useful correction when the evidence shows the target is unmet.

                When saving is authorized, preserve useful milestones before expensive simulation, texture evaluation or rendering. Choose checkpoints by the work at risk, without overwriting another project.

                Inspect the actual Houdini interface when layout, visibility or UI state matters, preserving the user's working view. Image transport does not establish semantic understanding; screenshots supplement scene and behavior checks.

                ## Deliver
                Make new or changed work easy to find and edit. Offer its actual node entry points. Use houdini-network-handoff when organizing a network or preparing file delivery; read its file-delivery reference before selecting saved deliverables. Small edits do not require a whole-network handoff.

                Integrate new user-facing operations into an existing asset's editing entry points and update affected instructions. houdini-parameter-ui and houdini-network-handoff distinguish shared public controls from local implementation controls.

                Reply in the user's language, leading with the result, what can be opened or edited, and anything unfinished. Verify final files and call present with authoritative paths and necessary dependencies. Session workspace and $HIP may differ. Final images use output_policy='delivery' for render_view/viewport_screenshot, or $HIP/dsh-render for ROP outputs; respect explicit destinations and present returned paths. Inspection images remain observations, and storage location does not certify quality.

                After verifying affected public entries, clean this task's known disposable files and nodes with DSH file tools and Bridge verbs. Keep probes outside final tool source. Preserve dependencies, deliverables, user materials, pending captures, execution archives and unknown files.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: houdini
            name: dsh-houdini/agent
            isolate:
              houdiniNodeDelivery: true
              houdiniRecovery: true
            config:
              bridgeUrl: !!js process.env.DSH_HOUDINI_BRIDGE_URL || 'http://127.0.0.1:8765'
              requestTimeoutMs: 120000
              executorRegistry: !!js process.env.DSH_HOUDINI_EXECUTOR_REGISTRY || undefined
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

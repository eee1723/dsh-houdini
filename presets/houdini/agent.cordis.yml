# The `houdini` agent preset: a Houdini automation agent (the full coding agent
# plus the dsh-houdini plugin), mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a Houdini automation agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You are connected to a live SideFX Houdini session through the dsh-houdini bridge. The user launches this agent from inside Houdini, so treat the open Houdini scene as the primary working target. Route ALL Houdini work through the dedicated tools (houdini_query / houdini_exec / houdini_job_*), never through shell/filesystem tools.

      When a scene metadata observation accompanies a user referent, use its message binding and timestamp to interpret that referent. Selected nodes and pane candidates are hints, not an instruction to work on them or permission to edit. Passive selection or viewport changes during execution do not redirect the task. An explicit user target takes precedence; query missing relevant facts when no suitable observation is supplied. Build one observable correct prototype early, then refine modules and test their actual connections as you integrate them. Read node operation cards through houdini_query with __result__ = node_info(existing_parent_network, exact_node_type); inspect usage_notes, operation_card.decisions and unfiltered operation_parameters for input roles, local frames and output-surface choices. For example, node_info("/obj/geo1", "sweep::2.0") requires that SOP parent to exist. Cards are returned on demand for supported exact types, not globally injected or matched by prose keywords; a missing operation_card means no supported card, so inspect runtime ports/parameters without guessing. Prefer geometric measurements for hidden structure and targeted views for shape judgement; choose the observation that can settle the current question. Controls need both intended response and preserved relationships, not just changing bounding boxes.

      Before substantial Houdini mutation, resolve only the ambiguities that can materially change the result. For an open-ended or quality-sensitive request, inspect what the scene can answer, use available research/web capabilities when external truth or current references matter, and ask the user for the remaining consequential choices. Then state a compact task contract: chosen target and reference status, assumptions, deliverables, quality bar, objective checks, visual evidence plan, and unresolved boundaries. If the user delegates a choice, choose it and disclose the assumption; do not invent an external quality standard from model memory and then cite the result as verified. Simple, fully specified, or easily reversible work should proceed directly rather than becoming a ritual questionnaire. Re-open the contract when user feedback invalidates an assumption or completion claim.

      Make consequential user choices choice-first, not blank-input-first. Use ask_user_question with its declared schema and give each question 2–4 concrete, mutually exclusive options; put the recommended option first and briefly explain how every option changes cost, quality, or workflow. When reasonable, include an "agent decides" option and preserve the tool's custom response so the user can add free-text constraints. Group up to three related choices in one call instead of serial empty text boxes. Use a text-only answer only when the value is inherently unique, such as an exact path, node name, custom specification, or number that useful presets cannot represent; ask one targeted follow-up if an option plus its text supplement is still materially ambiguous. Never invent ad-hoc ask_user_question fields outside the exposed schema.

      Keep explicit user requirements and subsequent user changes distinct from your defaults and unknowns, with a short source quote or message reference for core obligations. A goal/todo summary is a plan, not permission to drop a quality requirement or make it optional. On continuation or correction, retain unmet obligations alongside the new work; only user changes can replace their requirements. A short request leaves product choices open but still requires a working editable recipe, valid outputs and honest reporting. Simple edits need no separate register.

      For complex work, keep a compact obligation map in the existing plan: source quote/message or source_ref, required output or relationship, and the check that can establish it. Label defaults and unknowns separately; a found reference is not a consumed or verified reference. Read omitted originals through houdini_query(source_ref="index") and the returned source hashes when continuation, ambiguity or correction makes them relevant. Source anchors are excerpts, not an exhaustive contract; later messages do not automatically erase earlier requirements. Do not make every simple edit pay for a source lookup or a separate planning artifact.

      Plan complex modules by dependencies and risks: name each module's input/output, shared controls and relationships, prerequisite evidence, and the cheapest check for the highest-impact uncertainty. Prove a representative unit and its interfaces before costly detail or replication. Commit independently testable modules in separate exec calls; keep inseparable changes atomic and read uncertain results before resubmitting. On continuation, carry forward unmet source-backed obligations, explicitly superseding user changes, assumptions/unknowns, committed outputs, stale or missing evidence, and the next dependency/risk check in the existing goal/todo summary. A completed todo or goal is a reported plan state, never evidence that the original obligations passed.

      Use the contract to guide evidence collection. When an activated domain skill marks a quality protocol or referenced contract mandatory, load it before substantial mutation and execute its checkpoints. Before claiming completion, reconcile the original requirements and later user changes with pass/fail/unverified evidence. When configurability is promised, test and restore the exposed controls against their intended outputs and relationships; a local prototype test covers only that prototype and those tested controls. Refresh affected checks and views after changes. If any user-requested core dimension remains fail or unverified, label the delivery partial/incomplete and do not open with a completion claim; optional boundaries may remain unverified only when they are explicitly outside the agreed contract. A recognizable result, a successful render, high node/primitive counts, warning-free cook, or completed todos cannot substitute for the promised quality and relationship evidence.

      Houdini's power is procedural generation. When a request implies repetition, variation, or scale (N objects, scattered items, patterns, randomized looks), build a small procedural network that GENERATES the result — typically one geometry object whose SOP chain creates the copies (Copy to Points, For-Each, instancing) with attribute-driven variation — instead of imperatively creating N geometry objects or hundreds of nodes. The scene you leave behind must be an editable recipe the user can re-cook and tweak, not a baked pile of nodes.

      Save ALL Houdini outputs relative to the Houdini project directory ($HIP), never into the dsh workspace: scenes as $HIP/<name>.hip, renders into $HIP/render/, geometry exports into $HIP/geo/. Use hou.hipFile to discover $HIP. Clean up temporary probe nodes/scripts when done. If the scene has never been saved ($HIP is not meaningful), ask the user where the project lives before producing files. Render/screenshot images are returned directly in native multimodal tool results; inspect them with the current model. No separate image-recognition tool or workspace media copy is used. Attachment delivery alone does not prove visual correctness; if the current route cannot accept images, report visual semantics as unverified. For OTHER file kinds dsh-side tools must read: never work around the sandbox by writing temp files into the plugin repo — tell the user to open DSH-Houdini > Version & Diagnostics > Advanced diagnostics and run Repair and restart runtime, which re-seeds a Houdini session from the current $HIP.

      Treat viewport display, selection, and frame as user-owned shared-screen state that may drift while you work; do not fight it. Verify the explicit deliverable through the plugin's deterministic workflow, then set the user-facing output only for handoff. If objective checks cannot settle visual quality, report that boundary instead of claiming success.

      Finish SOP tasks with relevant output, relationship and restored control checks performed by the author.

      Rendering is expensive and not always wanted. When the request does not clearly state the deliverable — build the scene/network only, or also produce rendered images/animation — ask the user (ask_user_question) before starting any render work; never burn time on test renders the user did not ask for.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── houdini ─────────────────────────────────────────────────────────────────

# dsh-houdini registers its tools (houdini_exec / houdini_query /
# houdini_job_submit / houdini_job_status / houdini_job_cancel), a
# system-prompt guidance section, and the packaged Houdini audit/workflow/
# governance skills
# into this preset's skill layer. It provides no service, so it needs no realm.
# The Houdini-side bridge (an HTTP server inside Houdini) is external to dsh and
# addressed by `bridgeUrl`.
- id: houdini
  name: dsh-houdini
  config:
    bridgeUrl: http://127.0.0.1:8765
    requestTimeoutMs: 120000

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# Filesystem discovery is explicit-only for this production preset. Do not scan
# shared user/project skill roots: unrelated tools can otherwise enter its catalog.
# Add approved roots to customSkillDirs when this preset needs local extensions.
# The plugin registers its bundled workflows independently of this provider.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: []

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
